<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="每天看案例，练习Slogan、TVC与长文案，接受直接评分与问题分析。"><title>广告文案成长站</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="extras.css"><link rel="stylesheet" href="improve.css"><link rel="stylesheet" href="flow.css"><link rel="stylesheet" href="modes.css"></head>
<body><header class="topbar"><div class="brand"><span class="mark">文</span><span>广告文案成长站</span></div><div class="top-actions"><div class="streak">连续训练 <b id="streak">0</b> 天</div><button id="history-open" class="history-link">训练记录</button></div></header>
<nav class="mode-tabs" aria-label="选择训练模式"><button class="active" data-mode="slogan">Slogan</button><button data-mode="tvc">TVC 广告</button><button data-mode="long">长文案</button></nav>
<main><section class="hero"><div><p class="eyebrow" id="day"></p><h1>别等灵感。<br><em>训练判断力。</em></h1><p class="sub">依据《什么是好广告（第一版）》：三秒记住、记忆犹新、念念不忘、一看就买。</p></div><div class="score-card"><span>历史平均</span><strong id="average">—</strong><small id="count">完成第一次训练后生成</small></div></section>
<section class="workspace"><aside class="lesson"><div class="section-label" id="reading-label">01 / 今日10条语感输入</div><h2 class="case-title" id="reading-title">先连续看，不急着分析。</h2><div id="case-list" class="case-list"></div><div class="standard"><h3>看完再回想四件事</h3><div><span>01</span><i id="check1">哪一句3秒就记住</i></div><div><span>02</span><i id="check2">哪一句价值最清楚</i></div><div><span>03</span><i id="check3">哪一句最想念出来</i></div><div><span>04</span><i id="check4">哪一句最想让人行动</i></div></div></aside>
<section class="practice"><div class="section-label">02 / 今日创作命题</div><h2 id="practice-title">看完10条，再连续写3版。</h2><div class="grid"><label>产品/品牌<input id="product" readonly></label><label>目标顾客<input id="audience" readonly></label><label>独特价值<input id="value" readonly></label><label>可信证据<input id="proof" readonly></label></div><div class="drafts"><label class="slogan-label">版本一<textarea id="draft1" maxlength="40" placeholder="先写直觉版本，不要反复修改。"></textarea></label><label class="slogan-label">版本二<textarea id="draft2" maxlength="40" placeholder="换一个角度，突出价值或痛点。"></textarea></label><label class="slogan-label">版本三<textarea id="draft3" maxlength="40" placeholder="再压缩一次，尝试更强的节奏。"></textarea></label></div><button id="submit" disabled>比较三个版本，直接批评我</button></section></section>
<section class="result" id="result" hidden><div class="result-head"><div class="score"><span id="score"></span><small>/100</small></div><div><p>三版中的最高分</p><h2 id="verdict"></h2></div></div><div id="draft-scores" class="draft-scores"></div><div class="feedback"><div class="problems"><h3>最好版本最需要改的地方</h3><div id="problems"></div></div><div class="strengths"><h3>最好版本保留这些</h3><div id="strengths"></div></div></div><div class="result-actions"><button class="rewrite" id="rewrite">继续重写</button><button id="improve" class="improve-button">不知道怎么提分？查看高分改写</button></div><div id="improve-panel" class="improve-panel" hidden></div></section>
<section class="history" id="history" hidden><div class="history-head"><div><p class="section-label">成长档案</p><h2>历史训练记录</h2></div><button id="history-close" class="history-close">返回今日训练</button></div><div id="history-list" class="history-list"></div></section></main><script src="app.js"></script></body></html>
