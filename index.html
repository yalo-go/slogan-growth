<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="每天看案例、写广告语、接受直接评分与问题分析。"><title>广告语成长站</title><link rel="stylesheet" href="style.css"></head><body><header class="topbar"><div class="brand"><span class="mark">句</span><span>广告语成长站</span></div><div class="streak">连续训练 <b id="streak">0</b> 天</div></header><main><section class="hero"><div><p class="eyebrow" id="day"></p><h1>别等灵感。<br><em>训练判断力。</em></h1><p class="sub">依据《什么是好广告（第一版）》：三秒记住、记忆犹新、念念不忘、一看就买。</p></div><div class="score-card"><span>历史平均</span><strong id="average">—</strong><small id="count">完成第一次训练后生成</small></div></section><section class="workspace"><aside class="lesson"><div class="section-label">01 / 看一个好案例</div><blockquote id="case-line"></blockquote><div class="case-meta"><b id="case-brand"></b><p id="case-note"></p></div><div class="standard"><h3>今天只盯四件事</h3><div><span>01</span>3 秒能不能记住</div><div><span>02</span>有没有独特价值</div><div><span>03</span>能不能让人念念不忘</div><div><span>04</span>有没有购买指令</div></div></aside><section class="practice"><div class="section-label">02 / 写你的广告语</div><h2>先想清楚，再动笔。</h2><div class="grid"><label>产品/品牌<input id="product" placeholder="例：轻享酸奶"></label><label>目标顾客<input id="audience" placeholder="例：怕胖但爱吃甜的年轻人"></label><label>独特价值<input id="value" placeholder="例：低糖，但口感浓郁"></label><label>可信证据<input id="proof" placeholder="例：每杯仅 3g 糖"></label></div><label class="slogan-label">你的广告语<textarea id="slogan" maxlength="40" placeholder="不要写解释，只写最后要投放的那一句。"></textarea><span id="chars">0/40</span></label><button id="submit" disabled>提交，直接批评我</button></section></section><section class="result" id="result" hidden><div class="result-head"><div class="score"><span id="score"></span><small>/100</small></div><div><p>本次结论</p><h2 id="verdict"></h2></div></div><div class="feedback"><div class="problems"><h3>最需要改的地方</h3><div id="problems"></div></div><div class="strengths"><h3>保留这些</h3><div id="strengths"></div></div></div><button class="rewrite" id="rewrite">按问题重写一版</button></section></main><script src="app.js"></script></body></html>
